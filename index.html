<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>薩赫勒之歌 · Song of the Sahel — DSE 地理開放世界</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23e8a33d'/%3E%3Ccircle cx='32' cy='24' r='12' fill='%23ffd86b'/%3E%3Cpath d='M6 50 Q20 38 32 50 T58 50 V60 H6 Z' fill='%23b5762e'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<canvas id="scene"></canvas>

<!-- ============ 頂部狀態欄 ============ -->
<div id="hud" class="hidden">
  <div class="hud-left">
    <div class="season-chip" id="season-chip">
      <span id="season-icon">☀</span><span id="season-name">旱季</span>
      <span class="season-day" id="season-day">第 1 天</span>
    </div>
    <div class="season-chip hidden" id="herd-chip">
      <span>🐄</span><span>趕牛</span><b id="herd-count">跟隨 0 · 歸欄 0/6</b>
    </div>
    <div class="res-row">
      <div class="res" title="水（升）"><span class="ico">💧</span><div class="bar"><i id="bar-water"></i></div><b id="val-water">0</b></div>
      <div class="res" title="糧食（公斤·小米）"><span class="ico">🌾</span><div class="bar"><i id="bar-food"></i></div><b id="val-food">0</b></div>
      <div class="res" title="現金（西非法郎 F CFA）"><span class="ico">🪙</span><div class="bar"><i id="bar-cash"></i></div><b id="val-cash">0</b></div>
      <div class="res" title="土壤肥力（自家田）"><span class="ico">🟤</span><div class="bar"><i id="bar-fert"></i></div><b id="val-fert">0</b></div>
    </div>
    <div class="res-row">
      <div class="res wide" title="可持續發展指數：環境·經濟·社會的平衡"><span class="ico">♻</span><div class="bar"><i id="bar-sus"></i></div><b id="val-sus">50</b></div>
      <div class="res" title="已收集的地理知識點"><span class="ico">📘</span><b id="val-notes">0</b><span class="unit" id="notes-total">/59</span></div>
    </div>
  </div>
  <div class="hud-right">
    <button class="hud-btn" id="btn-journal" title="任務日誌 (Tab)">📜 日誌</button>
    <button class="hud-btn story-nav-btn" id="btn-story-nav" title="主線導航 (Q)">🧭 主線</button>
    <button class="hud-btn" id="btn-notes" title="地理筆記 (N)">📘 筆記</button>
    <button class="hud-btn" id="btn-inventory" title="背包 (I)">🎒 背包</button>
    <button class="hud-btn" id="btn-view" title="切換第一/第三人稱 (V)">👁 視角</button>
    <button class="hud-btn" id="btn-herd" title="吹哨趕牛／停止趕牛 (G)">🎵 吹哨</button>
    <button class="hud-btn" id="btn-music" title="環境音樂 開／關 (M)">♫ 音樂</button>
    <button class="hud-btn" id="btn-settings" title="設置 (Esc)">⚙ 設置</button>
    <button class="hud-btn" id="btn-help" title="操作説明 (H)">⌨ 操作</button>
    <!-- 當前目標：放在右上角按鈕區的下方，靠右對齊 -->
    <div id="objective" class="hidden">
      <div class="obj-chapter" id="obj-chapter">序章</div>
      <div class="obj-title" id="obj-title">農業系統</div>
      <ul class="obj-steps" id="obj-steps"></ul>
    </div>
  </div>
</div>

<!-- ============ 小地圖 + 地段懸浮標示 ============ -->
<div id="minimap-wrap" class="hidden">
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="mm-sites"></div>
  <div id="mm-tip" class="sims-tip hidden"></div>
  <button id="mm-expand" title="打開世界地圖 (B)">⤢ 世界地圖</button>
  <div class="mm-label">薩赫勒地區</div>
</div>

<!-- ============ 交互提示 ============ -->
<div id="interact-prompt" class="hidden"><kbd>F</kbd> <span id="interact-text">交談</span></div>

<!-- ============ 任務導航箭頭（指向當前目標） ============ -->
<div id="nav-arrow" class="hidden"><span class="na-ico">➤</span><b id="nav-dist"></b></div>
<div id="story-nav-arrow" class="hidden"><span class="sna-ico">➤</span><b>主線故事 · <span id="story-nav-dist"></span></b></div>

<!-- ============ 世界內提示（區域名稱） ============ -->
<div id="zone-banner" class="hidden"><span></span></div>

<!-- ============ 對話面板 ============ -->
<div id="dialogue" class="hidden">
  <div class="dlg-box">
    <div class="dlg-who"><span class="avatar" id="dlg-avatar">👵</span><div><div class="dlg-name" id="dlg-name">Aïcha</div><div class="dlg-role" id="dlg-role">祖母</div></div></div>
    <p class="dlg-text" id="dlg-text"></p>
    <div class="dlg-choices" id="dlg-choices"></div>
    <div class="dlg-next" id="dlg-next"><button id="dlg-continue">繼續 ▸</button><span class="dlg-hint">空格 / 點擊繼續</span></div>
  </div>
</div>

<!-- ============ 問答面板 ============ -->
<div id="quiz" class="hidden">
  <div class="quiz-box">
    <div class="quiz-head">
      <span class="quiz-tag" id="quiz-tag">農業與饑荒</span>
      <span class="quiz-src" id="quiz-src">C5 農業與饑荒 · 課堂筆記</span>
    </div>
    <div class="quiz-stem" id="quiz-stem"></div>
    <div id="quiz-figure" class="quiz-figure hidden"></div>
    <div class="quiz-opts" id="quiz-opts"></div>
    <div class="quiz-feedback hidden" id="quiz-feedback">
      <div class="fb-head" id="fb-head"></div>
      <div class="fb-body" id="fb-body"></div>
      <div class="fb-reward" id="fb-reward"></div>
      <button id="quiz-close">繼續 (空格)</button>
    </div>
  </div>
</div>

<!-- ============ 全屏遮罩：標題 / 日誌 / 筆記 / 幫助 / 小遊戲 / 結局 ============ -->
<div id="overlay" class="hidden">
  <div class="ov-panel" id="ov-panel"></div>
</div>

<!-- ============ 浮動提示 ============ -->
<div id="toast-wrap"></div>
<div id="fx-flash"></div>

<!-- ============ 世界上方的浮空地段標籤 ============ -->
<div id="world-labels"></div>

<!-- ============ 全屏世界地圖（模擬人生 Map View 風格） ============ -->
<div id="world-map" class="hidden">
  <div class="wm-shell">
    <div class="wm-head">
      <div>
        <div class="wm-kicker">WORLD MAP · 薩赫勒地區</div>
        <h2>世界地圖</h2>
        <div class="wm-sub">點選地段查看資料，或把它設為導航目標。</div>
      </div>
      <button id="wm-close" class="wm-x" title="關閉 (Esc / B)">✕</button>
    </div>
    <div class="wm-body">
      <div class="wm-map">
        <canvas id="wm-canvas" width="520" height="520"></canvas>
        <div id="wm-pins"></div>
      </div>
      <div class="wm-side">
        <div class="wm-side-head">地段 <b>10</b> 處</div>
        <div id="wm-cards"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 移動端搖桿 ============ -->
<div id="touch-ui" class="hidden">
  <div id="stick"><i></i></div>
  <button id="btn-sprint" title="疾跑（按住）">🏃</button>
  <button id="btn-whistle" type="button" title="吹哨趕牛" aria-label="吹哨趕牛">🎵</button>
  <button id="btn-act" type="button" aria-label="交互">F</button>
</div>

<div id="loading">
  <div class="ld-inner">
    <div class="ld-sun"></div>
    <div class="ld-title">薩赫勒之歌</div>
    <div class="ld-sub">Song of the Sahel · 開放世界地理冒險</div>
    <div class="ld-bar"><i id="ld-progress"></i></div>
    <div class="ld-tip" id="ld-tip">正在生成薩赫勒草原…</div>
  </div>
</div>

<!-- ============ 設置面板 ============ -->
<div id="settings-panel" class="hidden"></div>

<!-- ESM：單一 three 實例 + GLTFLoader，加載完成後按順序注入經典腳本 -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from './vendor/jsm/loaders/GLTFLoader.js';
  import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';
  // 把 ESM 模塊掛到 window，供經典腳本以全局 THREE / GLTFLoader 使用
  window.THREE = THREE;
  window.GLTFLoader = GLTFLoader;
  window.SkeletonUtils = { clone: cloneSkeleton };
    const scripts = [
      'js/config.js', 'js/settings.js', 'js/quiz.js', 'js/story.js', 'js/world.js',
      'js/loader.js', 'js/player.js', 'js/npcs.js', 'js/ui.js', 'js/game.js'
    ];
    const GAME_VER = 'v20261113i';   // 每次發佈變更，強制刷新緩存
  (async () => {
    for (const src of scripts) {
      await new Promise((res, rej) => {
        const el = document.createElement('script');
        el.src = src + '?v=' + GAME_VER;
        el.onload = res;
        el.onerror = () => rej(new Error('腳本加載失敗：' + src));
        document.body.appendChild(el);
      });
    }
  })().catch(err => {
    const t = document.getElementById('ld-tip');
    if (t) t.textContent = '啓動失敗：' + err.message;
    console.error(err);
  });
</script>
</body>
</html>
